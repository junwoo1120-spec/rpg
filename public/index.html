<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Open World RPG</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #login { position: fixed; inset: 0; display: flex; gap: 8px; align-items: center; justify-content: center; background: #1b2a3a; z-index: 2; }
    #login input, #login button { font-size: 18px; padding: 8px 12px; }
    #hud { position: fixed; top: 8px; left: 8px; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="login">
    <input id="nick" maxlength="16" placeholder="닉네임">
    <button id="start">입장</button>
  </div>
  <div id="hud"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
