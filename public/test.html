<!doctype html>
<meta charset="utf-8">
<title>진단</title>
<body style="font:16px sans-serif;padding:16px;white-space:pre-wrap">
<h3>진단 결과</h3>
<div id="out"></div>

<!-- main.js가 찾는 요소들 (화면엔 안 보임) -->
<div style="display:none"><div id="login"><input id="nick"><button id="start"></button></div><div id="hud"></div></div>

<script>
  const out = document.getElementById('out');
  function log(m) { out.textContent += m + '\n'; }
</script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script src="/socket.io/socket.io.js" onerror="log('❌ /socket.io/socket.io.js 로드 실패 (서버 문제)')"></script>
<script type="module">
  const files = [
    'three',
    '/shared/config.js',
    '/js/network/network.js',
    '/js/world/chunkMesh.js',
    '/js/world/chunkManager.js',
    '/js/world/water.js',
    '/js/player/input.js',
    '/js/player/avatar.js',
    '/js/player/localPlayer.js',
    '/js/player/remotePlayers.js',
    '/js/main.js',
  ];
  for (const f of files) {
    try { await import(f); log('✅ ' + f); }
    catch (e) { log('❌ ' + f + '\n    ' + e.message); }
  }

  if (typeof io !== 'function') { log('❌ socket.io 클라이언트 없음'); }
  else {
    try {
      const s = io();
      await new Promise((res, rej) => {
        s.on('connect', res);
        s.on('connect_error', rej);
        setTimeout(() => rej(new Error('8초 안에 연결 안 됨')), 8000);
      });
      log('✅ 서버 연결');
      const info = await new Promise((res, rej) => {
        s.emit('join', { nickname: 'test' }, res);
        setTimeout(() => rej(new Error('join 응답 없음')), 5000);
      });
      log('✅ join 응답 spawn=' + JSON.stringify(info.spawn));
      const c = await new Promise((res, rej) =>
        s.timeout(5000).emit('chunk:get', { cx: 0, cz: 0 }, (err, p) => (err ? rej(err) : res(p))));
      log('✅ 청크 수신: ' + (c ? c.heights.byteLength + ' bytes' : 'null'));
      s.disconnect();
    } catch (e) { log('❌ 서버 통신: ' + e.message); }
  }
  log('--- 끝 ---');
</script>
